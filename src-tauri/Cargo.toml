[package]
name = "developer-utilities"
version = "0.1.1"
description = "Utilitario standalone con herramientas del día a día para desarrolladores"
authors = ["José Saavedra"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
